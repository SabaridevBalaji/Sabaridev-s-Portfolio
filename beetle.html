<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <header>
        <h1>Volkswagen Beetle</h1>
        <p>Taken on Forza Horizon 5</p>
    </header>
    
        <a href="photography.html" class="button-link" id="backtomainpage">Back to Showcase</a>
   
    <section>
        
        <div class="picture-stack">
            <div class="picture-set">
                <img src="vw beetle/Screenshot-2025-07-09-080622.jpg" onclick="openFullscreen(this)">
            </div>
            <div class="picture-set">
                <img src="vw beetle/Screenshot-2025-07-09-080657.jpg" onclick="openFullscreen(this)"> 
            </div>
            <div class="picture-set">
                <img src="vw beetle/Screenshot-2025-07-09-080726.jpg" onclick="openFullscreen(this)">
            </div>
            <div class="picture-set">
                <img src="vw beetle/Screenshot-2025-07-09-082235-2.jpg" onclick="openFullscreen(this)">
            </div>
            <div class="picture-set">
                <img src="vw beetle/Screenshot-2025-07-09-082349.jpg" onclick="openFullscreen(this)">
            </div>
            <div class="picture-set">
                <img src="vw beetle/Screenshot-2025-07-09-082435.jpg" onclick="openFullscreen(this)">
            </div>
            <div class="picture-set">
                <img src="vw beetle/Screenshot-2025-07-09-082502.jpg" onclick="openFullscreen(this)">
            </div>
            <div class="picture-set">

            </div>

            <div class="picture-set">
                <img src="vw beetle/Screenshot-2025-07-09-084603.jpg" onclick="openFullscreen(this)">
            </div>
        </div>
    </section>

    <div id="fullscreen-ovrly" onclick="closeFullscreen()">
        <span class="close-btn">&times;</span>
        <img id="fullscreen-img">
    </div>

    <script>
        function openFullscreen(imgElement){
            const ovrly =document.getElementById("fullscreen-ovrly");
            const fullImg=document.getElementById("fullscreen-img") ;
            ovrly.style.display="flex";
            fullImg.src=imgElement.src;
        }
        function closeFullscreen(){
            document.getElementById("fullscreen-ovrly").style.display="none";
        }
    </script>
</body>
</html>
